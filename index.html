<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
      background: #15151c;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,.5);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border-radius: 12px;
      background: #242430;
      color: white;
      text-decoration: none;
      transition: .2s;
    }

    .button:hover {
      transform: scale(1.02);
      background: #30303d;
    }

    footer {
      margin-top: 30px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>WELCOME 👋</h1>

    <p class="subtitle">
      Selamat datang di website saya
    </p>

    <a href="#" class="button">🏠 Home</a>
    <a href="#" class="button">📱 Contact</a>
    <a href="#" class="button">🎮 Gaming</a>

    <footer>
      © 2026 Website
    </footer>
  </div>

</body>
</html>
